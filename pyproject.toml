[project]
name = "kite"
version = "0.9.4"
description = "Slim hybrid coding-agent harness (mini-swe-agent loop + tau-style tools/events/providers/memory)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.60.0",
  "tenacity>=8.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "rich>=13.7.0",
  "prompt_toolkit>=3.0.47",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8.0",
]

[project.scripts]
kite = "kite.cli.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kite = [
  "data/*.toml",
  "data/configs/*.toml",
  "data/prompts/*.md",
  "data/commands/*.md",
  "data/skills/*/SKILL.md",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
