name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KITE_HOME: /tmp/kite-home
      KITE_SKIP_SETUP: "1"
      KITE_TYPED_PICK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        shell: bash
        run: uv pip install -e ".[dev]"

      - name: Verify version stamps (fast)
        shell: bash
        run: python scripts/sync_version.py --check

      - name: Ruff
        shell: bash
        run: python -m ruff check src tests

  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      KITE_HOME: ${{ matrix.os == 'windows-latest' && 'C:\\Temp\\kite-home' || '/tmp/kite-home' }}
      KITE_SKIP_SETUP: "1"
      KITE_TYPED_PICK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        shell: bash
        run: uv pip install -e ".[dev]"

      - name: Pytest
        shell: bash
        run: python -m pytest -q --tb=short -p faulthandler

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KITE_HOME: /tmp/kite-home
      KITE_SKIP_SETUP: "1"
      KITE_TYPED_PICK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        shell: bash
        run: uv pip install -e ".[dev]"

      - name: Bench
        shell: bash
        run: python -m kite.cli.run bench --check

  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KITE_HOME: /tmp/kite-home
      KITE_SKIP_SETUP: "1"
      KITE_TYPED_PICK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        shell: bash
        run: uv pip install -e ".[dev]"

      - name: Verify release docs
        shell: bash
        run: python scripts/sync_version.py --check --release
