# Run pytest when a push or PR batches 5+ commits (mass commits).
# Small pushes skip to save CI minutes. Maintainers can re-run via Actions → Run workflow.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-count:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.count.outputs.count }}
      run_tests: ${{ steps.count.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count commits in this push or PR
        id: count
        env:
          PUSH_COMMITS: ${{ github.event.commits && length(github.event.commits) || 0 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "count=manual" >> "$GITHUB_OUTPUT"
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            COUNT="$(git rev-list --count "origin/${{ github.base_ref }}..HEAD")"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              COUNT=1
            elif git merge-base --is-ancestor "${BEFORE}" "${AFTER}" 2>/dev/null; then
              COUNT="$(git rev-list --count "${BEFORE}..${AFTER}")"
            elif [ "${PUSH_COMMITS:-0}" -gt 0 ]; then
              # Rebase/force-push: before..after is invalid; use webhook payload size.
              COUNT="${PUSH_COMMITS}"
            else
              # Unknown push shape — prefer running tests over silently skipping.
              COUNT=5
            fi
          fi

          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${COUNT}" -ge 5 ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Commits in batch: ${COUNT}"

  pytest:
    needs: commit-count
    if: needs.commit-count.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Kite + dev deps
        run: uv pip install -e ".[dev]"

      - name: pytest
        run: uv run pytest -q

  skipped:
    needs: commit-count
    if: needs.commit-count.outputs.run_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "pytest skipped — batch has ${{ needs.commit-count.outputs.count }} commit(s) (< 5)."
          echo "Push 5+ commits in one batch, or run this workflow manually from the Actions tab."
