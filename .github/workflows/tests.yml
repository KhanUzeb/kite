# Run pytest on every push and pull request to main.
# workflow_dispatch remains available for re-runs from the Actions tab.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      KITE_HOME: ${{ runner.temp }}/kite-home
      KITE_SKIP_SETUP: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Kite + dev deps
        run: uv pip install -e ".[dev]"

      - name: pytest
        run: uv run pytest -q

  install-smoke:
    runs-on: ubuntu-latest
    env:
      KITE_HOME: ${{ runner.temp }}/kite-install-home
      KITE_SKIP_SETUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: install.sh --no-clone (runtime only)
        run: ./scripts/install.sh --no-clone --no-dev

      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          kite --version
          kite providers
          kite help | head -n 5
