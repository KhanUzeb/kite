# pytest on every pull request and manual run.
# Direct pushes to main still use the 5+ commit batch gate to save minutes on tiny fixes.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Decide whether to run tests
        id: decide
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "reason=pull_request" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # push to main — batch gate (see CONTRIBUTING.md)
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          PUSH_COMMITS=0
          if [ -n "${COMMITS_JSON:-}" ] && [ "${COMMITS_JSON}" != "null" ]; then
            PUSH_COMMITS="$(python3 -c "import json, os; d=json.loads(os.environ['COMMITS_JSON']); print(len(d) if isinstance(d, list) else 0)")"
          fi
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            COUNT=1
          elif git merge-base --is-ancestor "${BEFORE}" "${AFTER}" 2>/dev/null; then
            COUNT="$(git rev-list --count "${BEFORE}..${AFTER}")"
          elif [ "${PUSH_COMMITS}" -gt 0 ]; then
            COUNT="${PUSH_COMMITS}"
          else
            COUNT=5
          fi

          echo "reason=push_batch_${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${COUNT}" -ge 5 ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Commits in push batch: ${COUNT}"

  pytest:
    needs: gate
    if: needs.gate.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    env:
      KITE_HOME: ${{ runner.temp }}/kite-home
      KITE_SKIP_SETUP: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Kite + dev deps
        run: uv pip install -e ".[dev]"

      - name: pytest
        run: uv run pytest -q

  install-smoke:
    needs: gate
    if: needs.gate.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    env:
      KITE_HOME: ${{ runner.temp }}/kite-install-home
      KITE_SKIP_SETUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: install.sh --no-clone (runtime only)
        run: ./scripts/install.sh --no-clone --no-dev

      - name: CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          kite --version
          kite providers
          kite help | head -n 5

  skipped:
    needs: gate
    if: needs.gate.outputs.run_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "pytest skipped (${{ needs.gate.outputs.reason }})."
          echo "Pull requests always run tests. Direct pushes to main need 5+ commits in the batch,"
          echo "or run this workflow manually from the Actions tab."
