# Kite built-in provider catalog (tau-inspired, slim).
# User overlay: ~/.kite/catalog.toml
# Preferences: ~/.kite/config.toml
#
# Models are NOT hardcoded — use `kite models` / `kite models --select`
# to fetch live ids from each provider using your API key.

schema_version = 1

[[providers]]
name = "openai"
display_name = "OpenAI"
kind = "openai"
litellm_prefix = ""
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
models = []
default_model = ""
docs_url = "https://platform.openai.com/docs"

[[providers]]
name = "anthropic"
display_name = "Anthropic"
kind = "anthropic"
litellm_prefix = "anthropic/"
base_url = "https://api.anthropic.com"
