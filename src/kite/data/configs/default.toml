# Default agent runtime config (override via ~/.kite/configs/default.toml or --config)

[agent]
name = "kite-default"
role = "auto"  # auto | architect | implementer | debugger
step_limit = 40
cost_limit = 5.0
wall_time_limit_seconds = 0
max_consecutive_format_errors = 3
auto_compact = true
compaction_reserve_tokens = 16384
compaction_keep_recent_tokens = 20000

[prompts]
system = "system"
instance = "instance"

[tools]
enabled = ["read", "write", "edit", "bash", "grep", "glob", "ls", "skill", "todo_write", "todo_read", "task", "webfetch", "websearch", "webcrawl", "subagent", "memory"]
bash_timeout_seconds = 30

[guardrails]
enabled = true
sandbox_to_cwd = true
allow_paths_outside_cwd = false
trusted_paths = []  # relative subtrees with elevated trust (e.g. "src/", "tests/")
deny_bash_patterns = [
  "git\\s+push",
  "git\\s+push\\s+--force",
  "mkfs",
  ":(){:|:&};:",
  "dd if=",
  "shutdown",
  "reboot",
  "powershell -enc",
  "curl .*\\|\\s*sh",
  "wget .*\\|\\s*sh",
  "Remove-Item.*-Recurse",
  "Stop-Computer",
  "Restart-Computer",
  "diskpart",
  "bcdedit",
]
block_secret_writes = true
max_bash_output_chars = 100000
max_read_chars = 200000

[skills]
enabled = true
auto_index_in_system_prompt = true
dirs = []  # extra skill dirs

[context]
include_git_status = true
include_tree_snippet = true
tree_max_entries = 80
max_context_chars = 24000

[github]
enabled = true

[cache]
enabled = true  # pi-style prefix caching; Anthropic cache_control + usage tracking

[orchestrator]
max_workers = 3
step_limit = 10
cost_limit = 1.0

# Terminal UI — loader style via KITE_LOADER=grid|dots|orbit|wave|spin
[ui]
loader = "grid"  # pixel-grid default (beautifului-inspired); override with KITE_LOADER

