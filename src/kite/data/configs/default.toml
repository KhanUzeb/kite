# Default agent runtime config (override via ~/.kite/configs/default.toml or --config)

[agent]
name = "kite-default"
role = "auto"  # auto | architect | implementer | debugger
step_limit = 40
cost_limit = 5.0
wall_time_limit_seconds = 0
model_timeout_seconds = 180
verify_before_submit = true
loop_hard_threshold = 7
provider_max_retries = 4
max_consecutive_format_errors = 3
auto_compact = true
compaction_ratio = 0.75
compaction_llm_ratio = 0.92
observation_max_chars = 5000
compaction_reserve_tokens = 12288
compaction_keep_recent_tokens = 12000
interactive_step_limit = 80
interactive_cost_limit = 10.0
max_budget_continues = 2

[prompts]
system = "system"
instance = "instance"

[tools]
enabled = ["bash", "read", "write", "edit", "grep", "glob", "ls", "set_cwd", "skill", "todo_write", "todo_read", "task", "submit", "webfetch", "websearch", "webcrawl", "subagent", "memory"]
bash_timeout_seconds = 120
progress_interval_seconds = 5.0

[guardrails]
enabled = true
sandbox_to_cwd = true
allow_paths_outside_cwd = false
execution_mode = "host"  # restricted | host — host allows paths outside session cwd (default)
trusted_paths = []  # relative subtrees with elevated trust (e.g. "src/", "tests/")
deny_bash_patterns = [
  "git\\s+push",
  "git\\s+push\\s+--force",
  "mkfs",
  ":(){:|:&};:",
  "dd if=",
  "shutdown",
  "reboot",
  "powershell -enc",
  "curl .*\\|\\s*sh",
  "wget .*\\|\\s*sh",
  "Stop-Computer",
  "Restart-Computer",
  "diskpart",
  "bcdedit",
]
block_secret_writes = true
max_bash_output_chars = 16384
max_read_chars = 100000

[skills]
enabled = true
auto_index_in_system_prompt = true
dirs = []  # extra skill dirs

[context]
include_git_status = true
include_tree_snippet = true
tree_max_entries = 60
max_context_chars = 12000

[memory]
inject = "opt_in"  # opt_in | always — durable MEMORY.md/episodic only when user asks

[environment]
auto_venv = true  # prepend .venv/venv to PATH for bash when pyvenv.cfg is present

[github]
enabled = false

[context7]
enabled = true
# Optional: CONTEXT7_API_KEY in ~/.kite/.env for higher rate limits (built-in docs MCP)

# Optional paid web tools (same ~/.kite/.env):
#   TAVILY_API_KEY / EXA_API_KEY / FIRECRAWL_API_KEY
#   kite web-keys set tavily|exa|firecrawl
#   or: kite keys --set tavily|exa|firecrawl
# Search auto-order: tavily → exa → firecrawl → duckduckgo
# Firecrawl also powers webfetch scrape + webcrawl

[cache]
enabled = true  # pi-style prefix caching; Anthropic cache_control + usage tracking

[orchestrator]
max_workers = 3
step_limit = 10
cost_limit = 1.0

# Terminal UI — also KITE_THEME / KITE_FONT / KITE_LOADER
[ui]
loader = "grid"  # pixel-grid default; override with KITE_LOADER=grid|dots|orbit|wave|spin
theme = "auto"  # auto|kite|dark|light|dim|mono|monochrome|catppuccin|ember|forest|hues|transparent
font = "unicode"  # unicode|ascii
